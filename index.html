<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba MediaPipe</title>
    <!-- Cargamos el motor de Google -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; color: white; flex-direction: column; }
        #contenedor-video { position: relative; width: 640px; height: 480px; border: 4px solid #00ff00; border-radius: 10px; overflow: hidden; }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        h1 { margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Prueba de Motor Google (MediaPipe)</h1>
    <p>Si esto funciona, tu Mac es compatible perfecto.</p>

    <div id="contenedor-video">
        <video id="video-entrada" playsinline></video>
        <canvas id="canvas-salida" width="640" height="480"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('video-entrada');
        const canvasElement = document.getElementById('canvas-salida');
        const canvasCtx = canvasElement.getContext('2d');

        // Configuramos el motor de Google
        const faceMesh = new FaceMesh({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
            }
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true, // Esto es clave para los ojos
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // Qué hacer cuando detecta algo
        faceMesh.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Dibujamos el video de fondo
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks) {
                for (const landmarks of results.multiFaceLandmarks) {
                    // Dibujamos los puntos de la cara
                    drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C070', lineWidth: 1});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#FF3030'});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#30FF30'});
                    drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#E0E0E0'});
                }
            }
            canvasCtx.restore();
        });

        // Prendemos la cámara y la mandamos al motor
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>

</body>
</html>
